# This Blueprint creates recurring PAID web/PostgreSQL resources.
# Review the plans and current Render pricing before applying it.
services:
  - type: web
    name: form-calisthenics
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bash backend/build.sh
    preDeployCommand: python backend/manage.py migrate --no-input
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: form-calisthenics-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # These values are entered privately when the Blueprint is applied.
      # Sandbox defaults are for limited testing, not public account signup.
      # Enter a newly rotated key privately. No credential lives in Git.
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        value: sandbox4a98e1d2d5bb46da98de52888e624231.mailgun.org
      - key: MAILGUN_API_BASE_URL
        value: https://api.mailgun.net
      - key: MAILGUN_SENDER_EMAIL
        value: postmaster@sandbox4a98e1d2d5bb46da98de52888e624231.mailgun.org
      - key: MAILGUN_SANDBOX_RECIPIENTS
        sync: false
      - key: MAILGUN_SENDER_NAME
        value: FORM
databases:
  - name: form-calisthenics-db
    region: oregon
    plan: 0.1c-256mb
    databaseName: form
    user: form
    postgresMajorVersion: "18"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
